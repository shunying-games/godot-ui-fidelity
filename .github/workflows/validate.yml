name: Validate skill

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Run geometry and publication tests
        run: python3 -B -m unittest discover -s scripts -p 'test_*.py'
      - name: Check committed history
        run: python3 scripts/check_publication.py --history HEAD
